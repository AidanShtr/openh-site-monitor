name: Site monitor (openh.co.il)

on:
  schedule:
    # Every 30 minutes. GitHub's cron scheduler is best-effort and can slip a few
    # minutes under load -- fine for this use case.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'site-monitor-report'
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run monitoring suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload HTML report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Publishes the latest report to GitHub Pages so you have a persistent
      # dashboard URL instead of digging through the Actions tab each time.
      # One-time setup required: repo Settings -> Pages -> Source: "GitHub Actions".
      - name: Upload report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  publish-dashboard:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
