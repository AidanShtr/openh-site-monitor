name: Site monitor (openh.co.il)

on:
  schedule:
    # Daily ~8:30 AM Israel time. GitHub Actions cron is UTC-only and deprioritizes jobs
    # landing exactly on :00/:30 under load (confirmed earlier -- caused hours-long
    # delays), hence :33 instead of :30. 05:33 UTC = 08:33 Israel Daylight Time (IDT,
    # UTC+3, in effect roughly Mar-Oct). When Israel switches to Standard Time (IST,
    # UTC+2) in late October, this will drift to 07:33 local -- bump to '33 6 * * *' then
    # if you want it to stay pinned to 8:30 AM year-round.
    - cron: '33 5 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force a failure, just to test the email alert end-to-end'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'site-monitor-report'
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Simulate failure (manual test of the email alert only)
        if: ${{ inputs.simulate_failure }}
        run: 'echo "Forcing a failure to test the email alert -- not a real site issue" && exit 1'

      - name: Run monitoring suite
        run: npx playwright test
        env:
          CI: true

      - name: Upload HTML report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Publishes the latest report to GitHub Pages so you have a persistent
      # dashboard URL instead of digging through the Actions tab each time.
      # One-time setup required: repo Settings -> Pages -> Source: "GitHub Actions".
      - name: Upload report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      # One-time setup required: add repo secrets MAIL_USERNAME (a Gmail address) and
      # MAIL_PASSWORD (a Gmail "App Password" for that address, not the normal login
      # password) via Settings -> Secrets and variables -> Actions.
      - name: Email alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⚠️ openh.co.il site monitor failed'
          to: openh2021@gmail.com
          from: openh.co.il Site Monitor
          body: |
            The synthetic monitor detected a failure on openh.co.il.

            Full report: https://aidanshtr.github.io/openh-site-monitor/
            This run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-dashboard:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
